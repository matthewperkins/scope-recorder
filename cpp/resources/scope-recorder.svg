<?xml version="1.0" encoding="UTF-8"?>
<!-- Scope Recorder icon: side view of a classic 1960s-80s Swiss stereo dissecting microscope
     (grey-green enamel body, magnification drum, inclined binocular head, pillar stand). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="enamel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c3cfc2"/>
      <stop offset="0.55" stop-color="#9aac9b"/>
      <stop offset="1" stop-color="#6f8272"/>
    </linearGradient>
    <linearGradient id="enamelSide" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7d8f7f"/>
      <stop offset="0.4" stop-color="#a9b9a8"/>
      <stop offset="1" stop-color="#76887a"/>
    </linearGradient>
    <linearGradient id="chrome" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8d9392"/>
      <stop offset="0.35" stop-color="#eef1f0"/>
      <stop offset="0.7" stop-color="#b4b9b8"/>
      <stop offset="1" stop-color="#7a7f7e"/>
    </linearGradient>
    <linearGradient id="base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a504e"/>
      <stop offset="1" stop-color="#1f2322"/>
    </linearGradient>
    <radialGradient id="knob" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#4b4b4b"/>
      <stop offset="1" stop-color="#121212"/>
    </radialGradient>
    <linearGradient id="stage" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f4ef"/>
      <stop offset="1" stop-color="#c9cbc4"/>
    </linearGradient>
  </defs>

  <!-- Base and stage plate -->
  <rect x="10" y="102" width="108" height="18" rx="7" fill="url(#base)"/>
  <rect x="12" y="103" width="104" height="3" rx="1.5" fill="#6b716f" opacity="0.6"/>
  <ellipse cx="52" cy="104" rx="30" ry="5.5" fill="url(#stage)" stroke="#3a3f3d" stroke-width="1.2"/>

  <!-- Pillar -->
  <rect x="92" y="26" width="11" height="80" rx="2" fill="url(#chrome)" stroke="#5c6261" stroke-width="0.8"/>
  <rect x="91" y="24" width="13" height="5" rx="2" fill="#2a2e2d"/>

  <!-- Focus arm with focusing knob -->
  <rect x="64" y="48" width="38" height="24" rx="5" fill="url(#enamel)" stroke="#4f5f52" stroke-width="1"/>
  <circle cx="88" cy="60" r="10" fill="url(#knob)"/>
  <circle cx="88" cy="60" r="10" fill="none" stroke="#000" stroke-width="2.4" stroke-dasharray="1.6 1.6" opacity="0.55"/>
  <circle cx="88" cy="60" r="4" fill="#3c3c3c"/>

  <!-- Objective nose pointing at the stage -->
  <path d="M38 80 L64 80 L60 92 Q51 95 42 92 Z" fill="#2a2d2c"/>
  <rect x="41" y="91" width="20" height="3" rx="1.5" fill="#8d9392"/>

  <!-- Inclined binocular head and eyepieces (towards the viewer, on the left) -->
  <g transform="rotate(-38 48 40)">
    <rect x="34" y="20" width="28" height="22" rx="5" fill="url(#enamelSide)" stroke="#4f5f52" stroke-width="1"/>
    <rect x="38" y="4" width="9" height="20" rx="2" fill="url(#chrome)" stroke="#5c6261" stroke-width="0.6"/>
    <rect x="49" y="4" width="9" height="20" rx="2" fill="url(#chrome)" stroke="#5c6261" stroke-width="0.6"/>
    <rect x="36.5" y="-2" width="12" height="9" rx="3" fill="#161616"/>
    <rect x="47.5" y="-2" width="12" height="9" rx="3" fill="#161616"/>
  </g>

  <!-- Main stereo body -->
  <rect x="28" y="40" width="46" height="42" rx="11" fill="url(#enamel)" stroke="#4f5f52" stroke-width="1.2"/>
  <rect x="32" y="43" width="38" height="5" rx="2.5" fill="#ffffff" opacity="0.25"/>

  <!-- Magnification drum -->
  <circle cx="51" cy="62" r="13" fill="url(#knob)"/>
  <circle cx="51" cy="62" r="13" fill="none" stroke="#000" stroke-width="3" stroke-dasharray="2 1.8" opacity="0.5"/>
  <circle cx="51" cy="62" r="6.5" fill="url(#chrome)" stroke="#2a2a2a" stroke-width="0.8"/>
  <path d="M51 49 L49.5 45.5 L52.5 45.5 Z" fill="#f0f0e8"/>
</svg>
